<!doctype html>
<html><body>
  <form class="application-form" action="/postings/example/apply" method="post">
    <label>Full name *<input name="name" required></label>
    <label>Email *<input name="email" type="email" required></label>
    <label>How many years of Python experience do you have? *<input name="python_years" type="number" required></label>
    <label>Expected salary *<input name="salary" required></label>
    <button type="submit">Submit application</button>
  </form>
</body></html>
