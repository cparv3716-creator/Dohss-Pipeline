<!doctype html>
<html lang="en">
<body>
  <!-- Sanitized structural reference manually transcribed from the live
       Karya and Instawork Greenhouse forms validated on 2026-10-17. -->
  <form id="karya-reference">
    <div data-field-id="karya-first"><label for="karya-first">First Name *</label><input id="karya-first" required></div>
    <div data-field-id="karya-last"><label for="karya-last">Last Name *</label><input id="karya-last" required></div>
    <div data-field-id="karya-preferred"><label for="karya-preferred">Preferred First Name</label><input id="karya-preferred"></div>
    <div data-field-id="karya-email"><label for="karya-email">Email *</label><input id="karya-email" type="email" required></div>
    <div data-field-id="karya-country"><label id="karya-country-label">Country</label><input id="karya-country" role="combobox" aria-labelledby="karya-country-label"><input aria-hidden="true"></div>
    <div data-field-id="karya-phone"><label for="karya-phone">Phone</label><input id="karya-phone" type="tel"></div>
    <div data-field-id="karya-resume"><label for="karya-resume">Resume/CV</label><input id="karya-resume" type="file"></div>
    <div data-field-id="karya-cover"><label for="karya-cover">Cover Letter</label><input id="karya-cover" type="file"></div>
    <div data-field-id="karya-linkedin"><label for="karya-linkedin">LinkedIn Profile</label><input id="karya-linkedin"></div>
    <div data-field-id="karya-website"><label for="karya-website">Website</label><input id="karya-website"></div>
  </form>

  <form id="instawork-reference">
    <div data-field-id="instawork-first"><label for="instawork-first">First Name *</label><input id="instawork-first" required></div>
    <div data-field-id="instawork-last"><label for="instawork-last">Last Name *</label><input id="instawork-last" required></div>
    <div data-field-id="instawork-preferred"><label for="instawork-preferred">Preferred First Name</label><input id="instawork-preferred"></div>
    <div data-field-id="instawork-email"><label for="instawork-email">Email *</label><input id="instawork-email" type="email" required></div>
    <div data-field-id="instawork-country"><label id="instawork-country-label">Country *</label><input id="instawork-country" role="combobox" aria-labelledby="instawork-country-label" aria-required="true"><input aria-hidden="true" required></div>
    <div data-field-id="instawork-phone"><label for="instawork-phone">Phone *</label><input id="instawork-phone" type="tel" required></div>
    <div data-field-id="instawork-city"><label id="instawork-city-label">Location (City) *</label><input id="instawork-city" role="combobox" aria-labelledby="instawork-city-label" aria-required="true"><input aria-hidden="true" required></div>
    <div data-field-id="instawork-resume"><label for="instawork-resume">Resume/CV</label><input id="instawork-resume" type="file"></div>
    <div data-field-id="instawork-cover"><label for="instawork-cover">Cover Letter</label><input id="instawork-cover" type="file"></div>
    <div data-field-id="instawork-linkedin"><label for="instawork-linkedin">LinkedIn Profile</label><input id="instawork-linkedin"></div>
    <div data-field-id="instawork-website"><label for="instawork-website">Website</label><input id="instawork-website"></div>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
