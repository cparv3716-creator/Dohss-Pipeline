name: DoHSS Outreach Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: dohss-outreach-bot
  cancel-in-progress: true

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run smoke checks
        run: |
          python scripts/smoke_check.py

      - name: Patch config from GitHub Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import yaml
          from pathlib import Path

          path = Path("config.yaml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))

          config.setdefault("telegram", {})
          config["telegram"]["bot_token"] = os.environ["TELEGRAM_BOT_TOKEN"]
          config["telegram"]["chat_id"] = os.environ["TELEGRAM_CHAT_ID"]
          config["telegram"]["enabled"] = True

          if os.environ.get("HUNTER_API_KEY"):
              config.setdefault("enrichment", {})
              config["enrichment"]["hunter_enabled"] = True

          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY

      - name: Run fetch once
        env:
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: |
          python main.py fetch-now

      - name: Restore config so secrets are not committed
        if: always()
        run: |
          git checkout -- config.yaml || true

      - name: Commit updated database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/pipeline.db || true

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update outreach pipeline database"
            git pull --rebase
            git push
          fi
