name: DoHSS EasyLeadz Integration

on:
  pull_request:
    paths:
      - "enrichment/easyleadz.py"
      - "scripts/easyleadz_*.py"
      - "scripts/import_hr_contacts.py"
      - ".github/workflows/easyleadz-enrichment.yml"
      - "docs/EASYLEADZ_AUTOMATION.md"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum new HR profiles to submit via API (optional API mode only)"
        required: false
        default: "25"
      csv_path:
        description: "Optional CSV path for API mode; blank uses hr_contacts table"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: dohss-easyleadz-enrichment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline smoke checks
        run: |
          python scripts/smoke_check.py
          python -m py_compile enrichment/easyleadz.py scripts/easyleadz_submit.py scripts/easyleadz_webhook.py scripts/import_hr_contacts.py scripts/easyleadz_prepare_csv.py scripts/easyleadz_import_results.py

      - name: Explain default no-API workflow
        run: |
          echo "Default subscription workflow: prepare CSV -> enrich in EasyLeadz dashboard -> import result CSV -> private Excel."
          echo "No EasyLeadz API key is required for that workflow."

  optional-api-submit:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Restore submission state
        uses: actions/cache@v4
        with:
          path: data/private/easyleadz_submit_state.json
          key: easyleadz-state-${{ github.run_id }}
          restore-keys: |
            easyleadz-state-

      - name: Validate optional API configuration
        env:
          EASYLEADZ_LIVE_MODE: ${{ secrets.EASYLEADZ_LIVE_MODE }}
          EASYLEADZ_API_KEY: ${{ secrets.EASYLEADZ_API_KEY }}
          EASYLEADZ_CALLBACK_URL: ${{ secrets.EASYLEADZ_CALLBACK_URL }}
        run: |
          python - <<'PY'
          import os
          live = os.getenv("EASYLEADZ_LIVE_MODE", "").lower() == "true"
          print("Optional API live mode:", live)
          if live:
              if not os.getenv("EASYLEADZ_API_KEY"):
                  raise SystemExit("Missing EASYLEADZ_API_KEY")
              cb = os.getenv("EASYLEADZ_CALLBACK_URL", "")
              if not cb.startswith("https://"):
                  raise SystemExit("EASYLEADZ_CALLBACK_URL must be HTTPS")
          PY

      - name: Submit via API only when explicitly enabled
        env:
          EASYLEADZ_LIVE_MODE: ${{ secrets.EASYLEADZ_LIVE_MODE }}
          EASYLEADZ_API_KEY: ${{ secrets.EASYLEADZ_API_KEY }}
          EASYLEADZ_CALLBACK_URL: ${{ secrets.EASYLEADZ_CALLBACK_URL }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT="25"; fi
          CSV_PATH="${{ github.event.inputs.csv_path }}"
          if [ -n "$CSV_PATH" ]; then
            python scripts/easyleadz_submit.py --csv "$CSV_PATH" --limit "$LIMIT"
          else
            python scripts/easyleadz_submit.py --db data/pipeline.db --limit "$LIMIT"
          fi

      - name: Upload non-sensitive submission state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easyleadz-submit-state-${{ github.run_id }}
          path: data/private/easyleadz_submit_state.json
          if-no-files-found: ignore
          retention-days: 14
